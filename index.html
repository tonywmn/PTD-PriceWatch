<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PriceTrack">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ptd-ui-enhancements.css">
  <title>PriceTrack Dashboard</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">PRICETRACK DASHBOARD</div><h1>Übersicht</h1></div>
      <button id="settingsBtn" class="icon-btn" aria-label="Einstellungen">⚙︎</button>
    </header>
    <main>
      <section id="hero" class="hero glass">
        <div><div class="status-row"><span class="live-dot"></span><span id="systemStatus">Monitoring wird geladen</span></div><h2 id="heroPrice">–</h2><p id="heroText">Preisdaten werden geladen</p></div>
        <button id="refreshBtn" class="round-btn" aria-label="Preisprüfung starten">↻</button>
      </section>
      <section class="metric-grid">
        <article class="metric glass"><span>Alarmgrenze</span><strong id="alertPrice">–</strong></article>
        <article class="metric glass"><span>Wunschpreis</span><strong id="targetPrice">–</strong></article>
        <article class="metric glass"><span>Letzter Scan</span><strong id="lastUpdated">–</strong></article>
      </section>
      <section><div class="section-head"><h2>Anbieter</h2><span id="providerCount"></span></div><div id="providerGrid" class="provider-grid"><div class="skeleton"></div></div></section>
      <section class="glass chart-card"><div class="section-head"><h2>Preisentwicklung</h2><div class="segmented"><button data-days="7">7T</button><button data-days="30" class="active">30T</button><button data-days="90">90T</button></div></div><canvas id="priceChart"></canvas><p id="chartEmpty" class="empty" hidden>Noch keine bestätigten Preisdaten.</p></section>
    </main>
    <nav class="tabbar glass"><button class="active">⌂<span>Übersicht</span></button><button id="notifyBtn">◉<span>Mitteilungen</span></button><button id="settingsTab">⚙︎<span>Einstellungen</span></button></nav>
  </div>
  <dialog id="settingsDialog"><form method="dialog" class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>Einstellungen</h2><button class="close-btn">Fertig</button></div><div id="authBlock"><p>Zur zentralen Bearbeitung anmelden.</p><input id="emailInput" type="email" placeholder="E-Mail-Adresse"><button id="loginBtn" type="button" class="primary">Magic Link senden</button></div><div id="settingsContent" hidden><label>Alarmgrenze (€)<input id="alertInput" type="number" min="1" step="1"></label><label>Wunschpreis (€)<input id="targetInput" type="number" min="1" step="1"></label><h3>Anbieter</h3><div id="sourceToggles"></div><button id="saveSettings" type="button" class="primary">Änderungen speichern</button><button id="enablePush" type="button" class="secondary">Push-Benachrichtigungen aktivieren</button><button id="logoutBtn" type="button" class="danger">Abmelden</button></div></form></dialog>
  <div id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="ptd-ui-enhancements.js"></script>
</body>
</html>
