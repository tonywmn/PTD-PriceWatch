name: Price Scan

on:
  schedule:
    - cron: '*/5 5-16 * * 1-5'
  workflow_dispat*h:
    inputs:
      force_scan:
 *      description: 'Zeitfenster fü* manuellen Scan überschreiben'
   *    required: false
        defaul*: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: price-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Chromium installieren
        run: python -m playwright install --with-deps chromium

      -       - name:*Preise*prüfen
        run: python scripts*scan_prices.py
        env:
      *   SUPABASE_URL: ${{ secrets.SUPAB*SE_URL }}
          SUPABASE_SECRE*_KEY: ${{ secrets.SUPABASE_SECRET_*EY }}
          VAPID_PUBLIC_KEY: *{{ secrets.VAPID_PUBLIC_KEY }}
   *      VAPID_PRIVATE_KEY: ${{ secre*s.VAPID_PRIVATE_KEY }}
          A*P_URL: https://tonywmn.github.io/P*D-PriceWatch/
          FORCE_SCAN* ${{ github.event_name == 'workflo*_dispatch' && inputs.force_scan ||*'false' }}
